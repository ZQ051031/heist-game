<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hushwork — a stealth heist</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #06080e; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Hushwork: sneak through a guarded room, avoid guards' torch beams and cameras, steal the prize and reach the exit"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<!-- Classic scripts sharing one namespace, so the game also runs straight from file:// with no server. -->
<script src="./src/config.js"></script>
<script src="./src/random.js"></script>
<script src="./src/levels.js"></script>
<script src="./src/geometry.js"></script>
<script src="./src/world.js"></script>
<script src="./src/input.js"></script>
<script src="./src/audio.js"></script>
<script src="./src/render.js"></script>
<script src="./src/shots.js"></script>
<script src="./src/main.js"></script>
</body>
</html>
